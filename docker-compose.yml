# Builds and runs this fork of AFFiNE (server, web, admin and the mobile PWA)
# from source, with Postgres and Redis.
#
#   docker compose up -d --build
#
# Data lives under ./.docker/selfhost/data (git- and docker-ignored). Point the
# volumes elsewhere for a real deployment.
#
# Search: the server has a built-in (embedded) indexer, so no search container
# is needed. It is off by default and is enabled in config.json, not by env
# vars (see below).
name: affine

x-affine-volumes: &affine-volumes
  - ./.docker/selfhost/data/storage:/root/.affine/storage
  - ./.docker/selfhost/data/config:/root/.affine/config

x-affine-environment: &affine-environment
  # Read on every start.
  DATABASE_URL: postgresql://affine@affine-postgres:5432/affine

  # Bootstrap values: on start, each one is copied into
  # ./.docker/selfhost/data/config/config.json only if that setting is not
  # there yet, so in practice they apply on the first run. From then on
  # config.json (also editable in the admin panel) is the source of truth and
  # changing these has no effect.
  REDIS_SERVER_HOST: affine-redis
  AFFINE_SERVER_HTTPS: 'false'
  AFFINE_SERVER_HOST: localhost
  AFFINE_SERVER_EXTERNAL_URL: http://localhost:3010
  # MAILER_HOST: smtp.example.com
  # MAILER_PORT: '465'
  # MAILER_USER: affine@example.com
  # MAILER_PASSWORD: secret
  # MAILER_SENDER: affine@example.com

  # To enable search, add this to config.json (there is no env var for it):
  #   "indexer": { "enabled": true, "provider.type": "embedded" }

  # Serves the mobile site/PWA to mobile browsers. It also selects the canary
  # release channel and skips client/server version checks.
  AFFINE_ENV: dev

  # Mobile debug back channel (pr/42); keep the token secret.
  # AFFINE_MOBILE_DEBUG_LOG_ENABLED: 'true'
  # AFFINE_MOBILE_DEBUG_EVAL_ENABLED: 'true'
  # AFFINE_MOBILE_DEBUG_EVAL_TOKEN: change-me

services:
  affine:
    container_name: affine
    build: .
    image: affine:N
    pull_policy: never
    ports:
      - '3010:3010'
    # Behind Traefik instead of a published port, e.g.:
    # labels:
    #   traefik.enable: 'true'
    #   traefik.http.routers.affine.rule: Host(`affine.example.com`)
    #   traefik.http.routers.affine.entrypoints: https
    #   traefik.http.services.affine.loadbalancer.server.port: '3010'
    depends_on:
      affine-redis:
        condition: service_healthy
      affine-postgres:
        condition: service_healthy
      affine-migration:
        condition: service_completed_successfully
    volumes: *affine-volumes
    environment: *affine-environment
    restart: unless-stopped

  affine-migration:
    container_name: affine-migration-job
    image: affine:N
    pull_policy: never
    command: ['sh', '-c', 'node ./scripts/self-host-predeploy.js']
    depends_on:
      affine-redis:
        condition: service_healthy
      affine-postgres:
        condition: service_healthy
    volumes: *affine-volumes
    environment: *affine-environment

  affine-redis:
    container_name: affine-redis
    image: redis
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  affine-postgres:
    container_name: affine-postgres
    image: pgvector/pgvector:pg16
    volumes:
      - ./.docker/selfhost/data/postgres:/var/lib/postgresql/data
    environment:
      # Only used when the data directory is first initialised.
      POSTGRES_USER: affine
      POSTGRES_DB: affine
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # No password: Postgres is reachable only on the compose network.
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'affine', '-d', 'affine']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
